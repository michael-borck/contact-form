services:
  contact:
    image: ghcr.io/michael-borck/contact-form:${TAG:-latest}
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    external: true
    name: caddy_default
